<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a {
            width: 200px;
            height: 200px;
            border: 2px dashed pink;
        }

        .b {
            width: 100px;
            height: 100px;
            border-radius: 50px;
            border: 1px solid red;
        }

        .c {
            width: 200px;
            height: 50px;
            border: 1px solid green;
            /* 圆角边框 */
            border-radius: 25px;
        }

        .d {
            width: 200px;
            height: 200px;
            background-color: pink;
            /* 居中 */
            margin: 0 auto;
        }

        /* 鼠标悬停 */
        .d:hover {
            background-color: brown;
            /* 阴影 */
            box-shadow: 10px 10px 15px -5px rgb(255, 0, 0);
        }

        .e {
            text-shadow: 0 0 5px rgb(0, 230, 57);
            color: blue;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
    <div class="e">计算机学院</div>


</body>

</html>
