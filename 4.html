<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color: #f55454;
        }

        * {
            padding: 0;
            margin: 0;
        }

        .box {
            list-style: none;
            width: 1000px;
            height: 500px;
            background-color: #d1dad1;
            float: left;
            margin: 0 auto;
        }
        .box1 {
            width: 200px;
            height: 500px;
            background-color: #eec8c8;
            float: left;
        }

        .box2 {
            width: 200px;
            height: 500px;
            background-color: #ec1e1e;
            float: left;
        }
        .box3 {
            width: 200px;
            height: 500px;
            background-color: #67e734;
            float: left;
        }
        .box4 {
            width: 200px;
            height: 500px;
            background-color: #961b62;
            float: left;
        }
        .box5 {
            width: 200px;
            height: 500px;
            background-color: #501c6e;
            float: left;
        }
        .div{
            width: 200px;
            height: 250px;
        }
        .box6{
            width: 200px;
            height: 250px;
            background-color: #c694e2;
            float: left;
        }
        .box7{
            width: 200px;
            height: 250px;
            background-color: #f6e6ff;
            float: left;
        }
        .box8{
            width: 200px;
            height: 250px;
            background-color: #f06969;
            float: left;
        }
        .box9{
            width: 200px;
            height: 250px;
            background-color: #6942c4;
            float: left;
        }
    </style>
</head>

<body>
    <h1>小米布局案例</h1>
    <ul class="box" >
        <li class="box1"></li>
        <li class="box2"><div class="box6"></div></li>
        <li class="box3"><div class="box7"></div</li>
        <li class="box4"><div class="box8"></div</li>
        <li class="box5"><div class="box9"></div</li>

    </ul>
</body>

</html>
