<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{padding: 0;margin: 0;}
        /* 大盒子 */
        .box{
            width: 1226px;
            height: 285px;
            background-color: purple;
            margin: 0 auto;
        }
        /* 小盒子 */
        .box li{
            list-style: none;
        width: 296px;
        height: 285px;
        background-color: #40c272;
        float: left;
        margin-right: 14px;

        }
        .cc{
            margin-right: 0 ;
            background-color: #b15656;
        }
    </style>
</head>
<body>
    <ul class="box">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li class="cc">4</li>
    </ul>
</body>
</html>
