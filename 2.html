<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            width: 1200px;
            height: 500px;
            background-color: pink;
            margin: 0 auto;
            /* 左浮动 */
            float: left;
        }

        .box2 {
            width: 200px;
            height: 500px;
            background-color: #3bb45f;
            float: left;
        }

        .box3 {
            width: 950px;
            height: 500px;
            background-color: #6e1ec97a;
            float: left;
            margin-left:20px;
        }
    </style>
</head>

<body>
    <div class="box1">
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
</body>

</html>
