<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页布局示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box1 {
            width: 80%;
            margin: 20px auto;
            border: 1px solid #eee;
        }
        /* 顶部头部 */
        .box2 {
            height: 60px;
            background-color: blue;
        }
        /* 导航栏 */
        .box3 {
            height: 20px;
            background-color: goldenrod;
        }
        /* 中间主体区域 */
        .box4 {
            display: flex;
        }
        /* 左侧边栏 */
        .box5 {
            width: 80px;
            background-color: #d3b9d1;
        }
        /* 主内容区 */
        .content {
            flex: 1;
            height: 300px;
            background-color: #cc4444;
        }
        /* 右侧边栏 */
        .box6 {
            width: 80px;
            background-color: #d3b9d1;
        }
        /* 底部 */
        .footer {
            height: 30px;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="box1">
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4">
            <div class="box5"></div>
            <div class="content"></div>
            <div class="box6"></div>
        </div>
        <div class="footer"></div>
    </div>
</body>
</html>
