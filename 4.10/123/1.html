<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 页面局部样式：仅用于本页面的内联示例样式 -->
    <style>
        #pp1 {
            color: blue;
            text-align: center;
            font-size: 50px;
        }
        
        #ppp2 {
            color: rgb(19, 164, 164);
            text-align: center;
            background-color: black;
        }
        
        .bc {
            color: rebeccapurple;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- 带 ID 的段落，示例包含跑马灯（marquee 非标准，仅作课堂演示） -->
    <p id="pp1">
        <marquee behavior="" direction="">hahahahhahaha</marquee>
    </p>
    <!-- 另一个 ID 示例，显示纯文本 -->
    <p id="ppp2">1236123981389317</p>
    <!-- 使用类选择器应用颜色样式 -->
    <p class="bc">asdadaddadda</p>
</body>

</html>
