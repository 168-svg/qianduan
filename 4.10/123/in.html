<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /*通配符选择器*/
      * {
        padding: 0%;
        margin: 0%;
      }
      div {
        background-color: rgb(237, 105, 105);
        width: 100px;
        height: 100px;
      }
      /*id选择器*/
      #div2 {
        background-color: #21bc31;
        width: 100px;
        height: 100px;
      }
      #div3 {
        background-color: #2966ec;
        width: 100px;
        height: 100px;
        
      }
    </style>
  </head>
  <body>
    <div></div>
    <div id="div2"></div>
    <div id="div3"></div>
  </body>
</html>
