<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 内联样式：用于示例性地展示类选择器和 ID 选择器的效果 */
        
        .p1 {
            color: red;
            text-align: center;
        }
        
        .p2 {
            text-align: center;
        }
        
        p.center {
            color: aqua;
            text-align: center;
        }
        
        .center {
            color: blueviolet;
            text-align: center;
        }
        
        #id1 {
            color: aquamarine;
            text-align: end;
            font-size: 300%;
        }
    </style>
    <link rel="stylesheet" href="mystyle.css">
</head>

<body>
    <!-- 使用 class="p1" 的段落，会应用到上方 .p1 的样式 -->
    <p class="p1">段落1</p>
    <!-- class p2 示例 -->
    <p class="p2">段落2</p>
    <!-- 多处复用同一类 center -->
    <p class="center">哈哈3</p>
    <p class="center">sd4</p>
    <!-- 标题也可以使用类来统一样式 -->
    <h1 class="center">第一个段落</h1>
    <!-- 使用 ID 选择器 #id1，通常用于页面中唯一的元素 -->
    <p id="id1">段落4</p>
</body>

</html>
