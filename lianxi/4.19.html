<!DOCTYPE html>
<html lang="en">

<head>
    <!-- 设置文档字符编码为UTF-8，支持中文等字符 -->
    <meta charset="UTF-8">
    <!-- 设置视口，确保页面在移动设备上正确显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 页面标题 -->
    <title>导航栏示例</title>
    <style>
        /* 导航栏容器样式 */
        
        ul {
            list-style: none;
            /* 移除列表默认样式 */
            background-color: blanchedalmond;
            /* 设置导航栏背景颜色 */
            width: 200px;
            /* 设置导航栏宽度 */
            margin: 0;
            /* 移除外边距 */
            padding: 0;
            /* 移除内边距 */
        }
        /* 导航链接样式 */
        
        li a {
            text-decoration: none;
            /* 移除下划线 */
            color: black;
            /* 设置链接文字颜色 */
            display: block;
            /* 将链接显示为块级元素 */
            padding: 8px 16px;
            /* 设置内边距 */
        }
        /* 鼠标悬停效果 */
        
        li a:hover {
            background-color: rgb(168, 104, 104);
            /* 悬停时背景变为深棕色 */
            color: red;
            /* 悬停时文字变为红色 */
        }
    </style>
</head>

<body>
    <!-- 页面主标题 -->
    <h1>导航栏</h1>

    <!-- 导航栏列表 -->
    <ul>
        <!-- 百度链接 -->
        <li><a href="https://www.baidu.com/">百度</a></li>
        <!-- vivo官网链接 -->
        <li><a href="https://www.vivo.com.cn/">vivo</a></li>
        <!-- 小米官网链接 -->
        <li><a href="https://www.mi.com/">小米</a></li>
        <!-- OPPO官网链接 -->
        <li><a href="https://www.oppo.com/">oppo</a></li>
    </ul>
</body>

</html>
